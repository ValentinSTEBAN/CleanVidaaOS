<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VLC</title>
    <link rel="icon" type="image/png" href="VLCicon.png">
    <script src="player_video.js" defer></script>
    <script src="player_ts.js"></script>
    <style>
        :root {
            --main-bg-color: #000000;
            --secondary-bg-color: #141414;
            --card-bg: #2a2a2a;
            --accent-color: #e50914;
            --accent-hover: #f43f5e;
            --text-color: #ffffff;
            --subtle-text: #aaaaaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--main-bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease;
        }

        header {
            text-align: left;
            padding: 30px 5%;
            background: #000000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            font-weight: 900;
        }

        .container {
            width: 90%;
            margin: 40px auto;
            padding: 0 10px;
        }

        .inputs-bar {
            display: none;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .inputs-bar input, .inputs-bar select, #catalog {
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--subtle-text);
            background: var(--card-bg);
            color: var(--text-color);
            outline: none;
            font-size: 1rem;
        }

        #catalog {
            width: 100%;
        }

        .inputs-bar input, .inputs-bar select {
            flex: 1;
            min-width: 150px;
        }

        #research {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid var(--subtle-text);
            outline: none;
            font-size: 1rem;
            background: var(--card-bg);
            color: var(--text-color);
            transition: border-color 0.3s;
        }

        #duration {
            border: 1px solid var(--subtle-text);
            background: var(--card-bg);
            color: var(--text-color);
            padding: 5px;
            border-radius: 6px;
        }

        #research:focus {
            border-color: var(--accent-color);
        }

        .share-boxes-container {
            display: none;
            gap: 20px;
            margin-bottom: 30px;
        }

        .share-box {
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            box-sizing: border-box;
            background-color: #1A1A1A;
        }

        @media (max-width: 900px) {
            .share-boxes-container {
                flex-direction: column;
            }
        }

        #movies {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        #movies a {
            display: block;
            text-decoration: none;
            color: inherit;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .movie {
            width: 100%;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .seasonsStyle {
            width: 100%;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .movie img {
            display: block;
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .movie h3 {
            font-size: 1rem;
            padding: 12px;
            text-align: left;
            color: var(--text-color);
            font-weight: 500;
        }

        .movie:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(229, 95, 20, 0.4);
            border-radius: 10px;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 10px;
        }

        button {
            color: var(--text-color);
            background-color: var(--accent-color);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        footer {
            color: var(--accent-color);
            margin-top: 50px;
            text-align: center;
            padding: 20px;
            border-top: 1px solid #333;
        }

        #contentPostLoading {
            display: none;
        }

        #Play {
            display: none;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .status-active { background: rgba(229, 95, 20, 0.2); color: var(--accent-color); }
        .status-expired { background: rgba(229, 95, 20, 0.2); color: var(--accent-color); }

        #linkGen {
            margin-top: 5px;
            padding: 5px;
        }

        #selectCat {
            border: 1px solid var(--subtle-text);
            background: var(--card-bg);
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 6px;
        }

        .selectSeries, .selectEP, .selectM, .selectLive{
            border: 0px;
            padding: 0px;
            background-color: #000000;
        }

        #XtreamBTN {
            margin-top: 5px;
        }

        .share-box input {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--subtle-text);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            transition: border-color 0.3s ease, background-color 0.3s ease;
            box-sizing: border-box;
        }

        .share-box #subcolor {
            height: 50px;
        }

        .share-box input:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 5px rgba(229, 95, 20, 0.5);
        }

        #subtitleTitle {
            margin-bottom: 3px;
            color: red;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #logoVLC {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .brand-logo h1 {
            margin: 0;
            font-size: 2.2rem;
            color: #ff8800;
        }

        .nav {
            display: flex;
            gap: 10px;
        }

        .nav button {
            background: transparent;
            background-color: #8c88881f;
            color: #aaa;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .nav button:hover {
            background: rgba(156, 147, 147, 0.461);
            color: white;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 25px;
        }

        button, .folder-label {
            border: 0;
            border-radius: 6px;
            padding: 12px 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .folder-label {
            background: var(--accent-color);
            color: #111;
        }

        #folderInput {
            display: none;
        }

        #search {
            flex: 1;
            min-width: 180px;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: var(--card-bg);
            color: white;
            font-size: 1rem;
        }

        #status {
            color: var(--subtle-text);
            margin-bottom: 20px;
        }

        #movies {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(170px, 1fr)
            );
            gap: 25px 18px;
        }

        .movie {
            min-width: 0;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .movie:hover {
            transform: scale(1.035);
            box-shadow: 0 8px 25px #ff880033;
        }

        .poster {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 4px;
            padding: 6px 4px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .perforations-top, .perforations-bottom {
            height: 6px;
            background-image: radial-gradient(circle, #fff 40%, transparent 45%);
            background-size: 12px 6px;
            margin-bottom: 4px;
        }
        .perforations-bottom {
            margin-top: 4px;
            margin-bottom: 0;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .vlc-badge {
            position: absolute;
            bottom: 10px;
            right: 8px;
            font-size: 18px;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
            z-index: 2;
        }

        .poster img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .poster-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
            text-align: center;
            color: var(--accent-color);
        }

        .poster-placeholder span {
            font-size: 3rem;
        }

        .poster-placeholder small {
            color: #bbb;
            overflow-wrap: anywhere;
        }

        .movie h3 {
            padding: 12px 12px 5px;
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .movie .filepath {
            color: var(--subtle-text);
            font-size: 0.75rem;
            padding: 0 12px 12px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        #playerSection {
            display: none;
            margin-bottom: 35px;
            background: #111;
            padding: 15px;
            border-radius: 10px;
        }

        #player {
            display: block;
            width: 100%;
            max-height: 75vh;
            background: black;
        }

        .player-title {
            padding: 12px 0 0;
            font-size: 1.1rem;
        }

        .empty {
            color: var(--subtle-text);
            padding: 30px 0;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.6rem;
            }

            #movies {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 15px 12px;
            }

            .container {
                width: 94%;
            }
        }
    </style>
    <link href="style_player_video.css" rel="stylesheet" />
</head>
<body>
    <header>
        <div class="brand-logo">
            <img src="VLCicon.png" id="logoVLC">
            <h1>VLC</h1>
        </div>
        <div id="statusInfo"></div>
        <nav class="nav">
            <button onclick="FileL()">Local File</button>
            <button onclick="FileO()">Online File</button>
            <button onclick="ShatingO()">Sharing</button>
            <button onclick="FolderL()">Folder</button>
        </nav>
    </header>
    <div class="container">
        <div id="FileURL">
            <div class="inputs-bar">
                <input id="linkURL" value="" placeholder="https or http URL">
                <button id="loading" class="btn-accent">Load</button>
            </div>
            <div class="inputs-bar" id="inputsbar1">
                <input id="linkLocal" value="" placeholder="" type="file">
                <button id="loadingLocal" class="btn-accent">Load</button>
            </div>
            <div class="inputs-bar" id="folderToolbar">
                <label class="folder-label" for="folderInput">
                    📁 Open Folder
                </label>
                <input
                    type="file"
                    id="folderInput"
                    webkitdirectory
                    multiple
                >
                <input
                    type="search"
                    id="search"
                    placeholder="Search for a film..."
                >
            </div>
            
            <div class="share-boxes-container">
                <div class="share-box">
                    <div class="share-controls">
                        <select id="duration">
                            <option value="0.0833">5 Minutes</option>
                            <option value="1">1 Hour</option>
                            <option value="2" selected>2 Hours</option>
                            <option value="6">6 Hours</option>
                            <option value="24">24 Hours</option>
                        </select>
                        <button id="linkGen" onclick="createShareLink()">Generate the temporary link</button>
                    </div>
                    <div id="shareResult" style="margin-top: 10px; display: none;">
                        <input id="shareUrlInput" readonly style="width: 70%; padding: 8px; background: #0f172a; color: #38bdf8; border: 1px solid #334155; border-radius: 4px;">
                        <button onclick="copyShareUrl()">Copy</button>
                    </div>
                </div>
            </div>
            <div id="Play">
                <div style="position: relative;">
                    <div id="player">
                        <video id="mainPlayer" preload="metadata"></video>

                        <div id="resultatsFullScreen"></div>

                        <div id="controls">
                            <button id="play">
                                ▶
                            </button>

                            <button id="back">
                                ↶
                            </button>

                            <button id="forward">
                                ↷
                            </button>

                            <span id="time">
                                0:00 / 0:00
                            </span>

                            <input
                                type="range"
                                id="progress"
                                min="0"
                                max="100"
                                value="0"
                            >

                            <button id="mute">
                                🔊
                            </button>

                            <input
                                type="range"
                                id="volume"
                                min="0"
                                max="1"
                                step="0.01"
                                value="1"
                            >
                            <button id="fullscreen">
                                ⛶
                            </button>
                        </div>
                    </div>
                    <div id="subtitles" style="
                        position: absolute;
                        bottom: 10%;
                        left: 0;
                        right: 0;
                        text-align: center;
                        color: white;
                        font-size: 20px;
                        font-family: Arial, sans-serif;
                        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
                        padding: 10px 20px;
                        border-radius: 4px;
                        margin: 0 20px;
                        pointer-events: none;
                        display: none;
                    ">
                        <span id="resultats"></span>
                    </div>
                </div>
                <video id="videoElement" class="ts_player" controls autoplay muted style="width:100%; height:50%; border: 1px solid rgba(229, 95, 20, 0.2);"></video>
                <div id="subtitlesDiv">
                    <div class="share-box">
                        <h3 id="subtitleTitle">Subtitle</h3>
                        <input type="file" id="srtFileInput" accept=".srt">
                        <input type="color" id="subcolor" value="rgba(255, 255, 255)">
                        <input type="number" min="0" id="subsize" value="20">
                        <input type="number" id="TimeSubInput" value="0">
                    </div>
                </div>
            </div>
            <div id="movies"></div>
        </div>
    </div>
<script>
    const FOnline = document.getElementsByClassName('inputs-bar')[0];
    const Flocal = document.getElementsByClassName('inputs-bar')[1];
    const Folder = document.getElementsByClassName('inputs-bar')[2];
    const SharingInput = document.getElementsByClassName('share-boxes-container')[0];
    const folderInput = document.getElementById("folderInput");
    const moviesContainer = document.getElementById("movies");
    const searchInput = document.getElementById("search");
    const statusText = document.getElementById("status");

    function FileO() {
        Flocal.style.display = 'none';
        moviesContainer.style.display = 'none';
        Folder.style.display = 'none';
        FOnline.style.display = 'flex';
    }

    function FileL() {
        FOnline.style.display = 'none';
        moviesContainer.style.display = 'none';
        Folder.style.display = 'none';
        Flocal.style.display = 'flex';
        SharingInput.style.display = 'none';
    }

    FileL();

    function ShatingO() {
        if(FOnline.style.display == 'flex') {
            SharingInput.style.display = 'flex';
        }
    }

    function FolderL() {
        video.pause();
        moviesContainer.style.display = 'grid';
        Play.style.display = 'none';
        Folder.style.display = 'flex';
        SharingInput.style.display = 'none';
        Flocal.style.display = 'none';
        FOnline.style.display = 'none';
    }

    let l = [];

    const searchBar = document.getElementById('search');
    searchBar.addEventListener('input', function() {
        const searchTerm = searchBar.value;
        
        l.forEach(item => {
            if (item.name.includes(searchTerm)) {
                item.element.style.display = 'block';
            } else {
                item.element.style.display = 'none';
            }
        });
    });

    folderInput.addEventListener('change', function(event) {
        const files = event.target.files;
        moviesContainer.innerHTML = '';
        l = [];

        if (files.length === 0) {
            moviesContainer.innerHTML = '<p class="empty">No files found in this folder.</p>';
            return;
        }

        Array.from(files).forEach((file, index) => {
            if (!file.type.startsWith('video/') && !file.name.match(/\.(mp4|mkv|avi|mov|webm)$/i)) {
                return; 
            }

            const fileName = file.name;
            const fileURL = URL.createObjectURL(file);

            const movieCard = document.createElement('div');
            movieCard.className = 'movie';

            movieCard.innerHTML = `
                <div class="poster film-strip">
                    <div class="perforations-top"></div>
                    <div class="video-wrapper">
                        <video src="${fileURL}#t=0.1" preload="metadata"></video>
                    </div>
                    <div class="perforations-bottom"></div>
                    <div class="vlc-badge"><img src="VLCicon.png" style="height:30px; width:30px"></div>
                </div>
                <h3>${fileName}</h3>
                <div class="filepath">${file.webkitRelativePath || fileName}</div>
            `;

            l.push({ name: fileName, element: movieCard });

            movieCard.addEventListener('click', function() {
                Play.style.display = 'block';
                Vplayer.style.display = 'block';
                videoElement.style.display = 'none';
                subtitlesDiv.style.display = 'block';
                
                mainPlayer.src = fileURL;
                mainPlayer.play();
                FileL();
            });

            moviesContainer.appendChild(movieCard);
        });
    });



    const Play = document.getElementById('Play');
    const linkURL = document.getElementById('linkURL');
    const linkLocal = document.getElementById('linkLocal');
    const loading = document.getElementById('loading');
    const loadingLocal = document.getElementById('loadingLocal');

    const videoElement = document.getElementById('videoElement');
    const mainPlayer = document.getElementById('mainPlayer');
    const Vplayer = document.getElementById('player');

    const subtitlesDiv = document.getElementById('subtitlesDiv');

    loading.addEventListener('click', function() {
        if (linkURL.value.length < 2) {
            alert("Please enter your URL first.");
        } else {
            document.getElementById('srtFileInput').value = '';
            subtitlesText = [];
            subtitlesTimeStart = [];
            subtitlesTimeEnd = [];
            document.getElementById('subtitles').style.display = 'none';
            document.getElementById('resultatsFullScreen').style.display = 'none';

            Play.style.display = 'block';
            let elt = linkURL.value.length;
            let URL = linkURL.value;
            if (URL[elt-1] == 's' && URL[elt-2] == 't') {
                videoElement.style.display = 'block';
                Vplayer.style.display = 'none';
                subtitlesDiv.style.display = 'none';
                if (mpegts.getFeatureList().mseLivePlayback) {
                    const player = mpegts.createPlayer({
                        type: 'mse',
                        isLive: true,
                        url: URL
                    });
                    
                    player.attachMediaElement(videoElement);
                    player.load();
                    player.play();
                }
            } else {
                Vplayer.style.display = 'block';
                videoElement.style.display = 'none';
                subtitlesDiv.style.display = 'block';
                mainPlayer.src = URL;
                mainPlayer.play();

                // ----
                const subtitles = document.getElementById('subtitles');

                let numSubtitle = 0;
                let t = mainPlayer.currentTime;

                mainPlayer.addEventListener('timeupdate', function() {
                    if (subtitlesText.length != 0) {
                        if (t > mainPlayer.currentTime) {
                            numSubtitle = 0;
                            while (mainPlayer.currentTime.toFixed(3) > subtitlesTimeEnd[numSubtitle]) {
                                numSubtitle += 1;
                            }
                        } else if (t+9 < mainPlayer.currentTime) {
                            numSubtitle = 0;
                            while (mainPlayer.currentTime.toFixed(3) > subtitlesTimeEnd[numSubtitle]) {
                                numSubtitle += 1;
                            }
                        } else {
                            subtitles.style.display = 'block';
                            subtitles.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';

                            const temps = mainPlayer.currentTime;

                            if (subtitlesTimeStart[numSubtitle] < temps.toFixed(3) && temps.toFixed(3) < subtitlesTimeEnd[numSubtitle]) {
                                displaySubtitles(subtitlesText[numSubtitle+1]);
                            } else if (temps.toFixed(3) > subtitlesTimeEnd[numSubtitle]) {
                                numSubtitle += 1;
                                displaySubtitles('    ');
                            }
                        }
                    }
                    t = mainPlayer.currentTime;
                });
                // -----
            }
        }
    });

    let currentVideoURL = null;

    loadingLocal.addEventListener('click', function() {
        if (linkLocal.value.length < 2) {
            alert("Please enter your URL first.");
        } else {
            document.getElementById('srtFileInput').value = '';
            subtitlesText = [];
            subtitlesTimeStart = [];
            subtitlesTimeEnd = [];
            document.getElementById('subtitles').style.display = 'none';
            document.getElementById('resultatsFullScreen').style.display = 'none';

            Play.style.display = 'block';
            let elt = linkLocal.value.length;
            //let URL = linkLocal.value;

            const file = linkLocal.files[0];
            currentVideoURL = URL.createObjectURL(file);
            console.log(currentVideoURL);

            if (currentVideoURL[elt-1] == 's' && currentVideoURL[elt-2] == 't') {
                videoElement.style.display = 'block';
                Vplayer.style.display = 'none';
                subtitlesDiv.style.display = 'none';
                if (mpegts.getFeatureList().mseLivePlayback) {
                    const player = mpegts.createPlayer({
                        type: 'mse',
                        isLive: true,
                        currentVideoURL: currentVideoURL
                    });
                    
                    player.attachMediaElement(videoElement);
                    player.load();
                    player.play();
                }
            } else {
                Vplayer.style.display = 'block';
                videoElement.style.display = 'none';
                subtitlesDiv.style.display = 'block';
                mainPlayer.src = currentVideoURL;
                mainPlayer.play();

                // ----
                const subtitles = document.getElementById('subtitles');

                let numSubtitle = 0;
                let t = mainPlayer.currentTime;

                mainPlayer.addEventListener('timeupdate', function() {
                    if (subtitlesText.length != 0) {
                        if (t > mainPlayer.currentTime) {
                            numSubtitle = 0;
                            while (mainPlayer.currentTime.toFixed(3) > subtitlesTimeEnd[numSubtitle]) {
                                numSubtitle += 1;
                            }
                        } else if (t+9 < mainPlayer.currentTime) {
                            numSubtitle = 0;
                            while (mainPlayer.currentTime.toFixed(3) > subtitlesTimeEnd[numSubtitle]) {
                                numSubtitle += 1;
                            }
                        } else {
                            subtitles.style.display = 'block';
                            subtitles.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';

                            const temps = mainPlayer.currentTime;

                            if (subtitlesTimeStart[numSubtitle] < temps.toFixed(3) && temps.toFixed(3) < subtitlesTimeEnd[numSubtitle]) {
                                displaySubtitles(subtitlesText[numSubtitle+1]);
                            } else if (temps.toFixed(3) > subtitlesTimeEnd[numSubtitle]) {
                                numSubtitle += 1;
                                displaySubtitles('    ');
                            }
                        }
                    }
                    t = mainPlayer.currentTime;
                });
                // -----
            }
        }
    });

    //-------
    document.getElementById('srtFileInput').addEventListener('change', handleFileUpload, false);

    function handleFileUpload(event) {
        const file = event.target.files[0];

        if (!file) {
            return;
        }

        const reader = new FileReader();

        reader.onload = function(e) {
            const srtText = e.target.result;
            
            const subtitles = parseSRT(srtText);
        };

        reader.readAsText(file);
    }

    const subcolor = document.getElementById('subcolor');
    subcolor.addEventListener('change', function() {
        document.getElementById('resultatsFullScreen').style.color = subcolor.value;
        document.getElementById('resultats').style.color = subcolor.value;
    });

    const subsize = document.getElementById('subsize');
    subsize.addEventListener('change', function() {
        document.getElementById('resultatsFullScreen').style.fontSize = subsize.value + 'px';
        document.getElementById('resultats').style.fontSize = subsize.value + 'px';
    });

    let subtitlesText = [];
    let subtitlesTimeStart = [];
    let subtitlesTimeEnd = [];

    let TimeSub = 0;
    const TimeSubInput = document.getElementById('TimeSubInput');
    TimeSubInput.addEventListener('change', function() {
        TimeSub = TimeSubInput.value;
        ChangTimeSub();
    });

    function ChangTimeSub() {
        if (subtitlesTimeStart.length != 0 && subtitlesTimeEnd.length != 0) {
            for (let i = 0; i < subtitlesTimeEnd.length; i++) {
                subtitlesTimeStart[i] = parseFloat(subtitlesTimeStart[i]) + parseFloat(TimeSub);
                subtitlesTimeEnd[i] = parseFloat(subtitlesTimeEnd[i]) + parseFloat(TimeSub);
            }
        }
    }

    function parseSRT(srtText) {
        const lines = srtText.split('\n');
        const subtitlesArray = [];

        let currentSubtitle = null;

        let textForTimeCode = '';

        lines.forEach(line => {
            if (line.match(/^\d+$/) && line.trim() !== '') {
                return;
            }
            if (line.match(/^\d{2}:\d{2}:\d{2},\d{3} --> \d{2}:\d{2}:\d{2},\d{3}/)) {
                const timeRange = line.trim();
                
                currentSubtitle = {
                    index: subtitlesArray.length + 1,
                    start: timeRange.split('-->')[0].trim(),
                    end: timeRange.split('-->')[1].trim(),
                    text: ""
                };

                subtitlesTimeStart.push(convertirTempsEnSecondes(timeRange.split('-->')[0].trim()));
                subtitlesTimeEnd.push(convertirTempsEnSecondes(timeRange.split('-->')[1].trim()));
                subtitlesText.push(textForTimeCode);
                textForTimeCode = '';

                subtitlesArray.push(currentSubtitle);
            } else if (currentSubtitle) {
                const text = line.trim();
                currentSubtitle.text = text;
                if (isNaN(parseFloat(text)) && text != '') {
                    textForTimeCode += text;
                }
            }
        });

        return subtitlesArray;
    }

    function displaySubtitles(subtitles) {
        const resultElement = document.getElementById('resultats');
        const resultatsFullScreen = document.getElementById('resultatsFullScreen');
        
        if (subtitles.length === 0) {
            resultElement.textContent = "No subtitles found.";
            resultatsFullScreen = "No subtitles found.";
            return;
        }

        resultElement.textContent = subtitles;
        resultatsFullScreen.textContent = subtitles;
    }

    function convertirTempsEnSecondes(timeString) {
        const parts = timeString.split(',');
        
        if (parts.length !== 2) {
            throw new Error("Invalid time format.");
        }

        const timePart = parts[0];
        const msPart = parts[1];

        const timeComponents = timePart.split(':');
        
        const hours = parseInt(timeComponents[0], 10);
        const minutes = parseInt(timeComponents[1], 10);
        const seconds = parseInt(timeComponents[2], 10);
        
        const milliseconds = parseInt(msPart, 10);

        const totalSeconds = (hours * 3600) + (minutes * 60) + seconds + (milliseconds / 1000);

        return totalSeconds;
    }
    //-------


    function bufferToBase64Url(buffer) {
        return btoa(String.fromCharCode(...new Uint8Array(buffer)))
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function base64UrlToBuffer(base64url) {
        let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) base64 += '=';
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes.buffer;
    }

    async function createShareLink() {
        const url = linkURL.value.trim().replace(/\/$/, '');
        const durationHours = parseFloat(document.getElementById('duration').value);

        if (!url) {
            alert("First, fill in the Username, Password, and URL fields.");
            return;
        }

        const expiresAt = Date.now() + (durationHours * 3600 * 1000);
        const payload = JSON.stringify({url, expiresAt });

        const key = await window.crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const encrypted = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(payload));
        const exportedKey = await window.crypto.subtle.exportKey("raw", key);

        const hash = `data=${bufferToBase64Url(encrypted)}&iv=${bufferToBase64Url(iv)}&k=${bufferToBase64Url(exportedKey)}`;
        const fullLink = `${window.location.origin}${window.location.pathname}#${hash}`;

        document.getElementById('shareUrlInput').value = fullLink;
        document.getElementById('shareResult').style.display = 'block';
    }

    function copyShareUrl() {
        const input = document.getElementById('shareUrlInput');
        input.select();
        document.execCommand('copy');
        alert("Temporary link copied!");
    }

    async function checkIncomingToken() {
        const hash = window.location.hash.substring(1);
        if (!hash) return;

        const params = new URLSearchParams(hash);
        const data = params.get('data');
        const iv = params.get('iv');
        const key = params.get('k');

        if (data && iv && key) {
            try {
                const keyBuffer = base64UrlToBuffer(key);
                const importedKey = await window.crypto.subtle.importKey("raw", keyBuffer, { name: "AES-GCM" }, false, ["decrypt"]);
                const decrypted = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: new Uint8Array(base64UrlToBuffer(iv)) },
                    importedKey,
                    base64UrlToBuffer(data)
                );

                const config = JSON.parse(new TextDecoder().decode(decrypted));

                document.querySelector('.inputs-bar').style.display = 'none';
                document.querySelector('.share-box').style.display = 'none';

                if (Date.now() > config.expiresAt) {
                    document.getElementById('statusInfo').innerHTML = `<div class="status-badge status-expired">This access link has expired.</div>`;
                    const container = document.getElementsByClassName('container');
                    container[0].innerHTML = '';
                    return;
                }

                startTimer(config.expiresAt);

                linkURL.value = config.url;
                loading.click();
                document.getElementsByTagName('nav')[0].style.display = 'none';
                Flocal.style.display = 'none';

            } catch (e) {
                console.error(e);
                alert("Invalid or corrupted temporary link.");
            }
        }
    }

    function startTimer(expiresAt) {
        const statusEl = document.getElementById('statusInfo');
            
        function update() {
            const left = expiresAt - Date.now();
            if (left <= 0) {
                clearInterval(countdownInterval);
                statusEl.innerHTML = `<div class="status-badge status-expired">Access time expired!</div>`;
                const container = document.getElementsByClassName('container');
                container[0].innerHTML = '';
                document.getElementById('contentPostLoading').style.display = 'none';
                activeCredentials = null;
                return;
            }
            const m = Math.floor((left % 3600000) / 60000);
            const s = Math.floor((left % 60000) / 1000);
            const h = Math.floor(left / 3600000);
            statusEl.innerHTML = `<div class="status-badge status-active">Temporary access active — Time remaining: ${h}h ${m}m ${s}s</div>`;
        }

        update();
        countdownInterval = setInterval(update, 1000);
    }

    window.addEventListener('load', checkIncomingToken);
</script>
